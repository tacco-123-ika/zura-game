<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b35"><title>ヅラよ、帰ってこい！</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#9bd8ff,#f8fbff 48%,#d8edff);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#17233a;text-align:center}.wrap{max-width:620px;margin:auto;padding:16px}.panel{background:#ffffffed;border:2px solid #d4e5f5;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 5px 0 #bad4e9}h1{font-size:clamp(27px,7vw,40px);margin:12px 0 4px;color:#163b74;text-shadow:1px 2px #fff}.sub{margin:0 0 12px;color:#365577;font-weight:700}.stats{display:flex;justify-content:space-between;font-weight:800;color:#24436b}.hero{height:235px;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;background:linear-gradient(#c5edff,#fff);border-radius:16px;margin:12px 0}.hero img{height:225px;max-width:85%;object-fit:contain;transition:transform .6s}.hero.fly img{transform:translate(150px,-90px) rotate(25deg);opacity:.25}.message{font-weight:800;font-size:18px;min-height:48px;display:flex;align-items:center;justify-content:center}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{border:2px solid #b9d3ed;border-radius:14px;background:#f5fbff;padding:9px 5px;font-size:16px;font-weight:800;color:#1c3556;cursor:pointer;min-height:75px}.choice .icon{display:block;font-size:30px}.choice.selected{border-color:#176bd1;background:#dceeff;box-shadow:inset 0 0 0 2px #176bd1}.btn{border:0;border-radius:16px;padding:14px 18px;background:#1674d1;color:#fff;font-size:19px;font-weight:900;width:100%;margin-top:12px;box-shadow:0 4px 0 #0a4d95;cursor:pointer}.btn:disabled{opacity:.45}.secondary{background:#526b89;box-shadow:0 4px 0 #34465e}.tiny{font-size:12px;color:#536780;line-height:1.5}.result{font-size:23px;font-weight:900;color:#124f8e}.gone{display:none}.return{animation:return .8s ease}@keyframes return{0%{transform:translateY(-120px) rotate(-30deg);opacity:.2}100%{transform:translateY(0) rotate(0);opacity:1}}@media(min-width:500px){.choices{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><main class="wrap"><h1>ヅラよ、帰ってこい！</h1><p class="sub">～風に飛ばして、翌日に戻ってくるヅラを待つゲーム～</p><section class="panel"><div class="stats"><span id="day">1日目</span><span>帰還回数：<b id="count">0</b>回</span></div><div class="hero" id="hero"><img id="person" src="character_wig.png" alt="黒いスーツのキャラクター"></div><div class="message" id="message">好きなヅラを選んで、強風で飛ばそう！</div><div id="choose"><div class="choices" id="choices"></div><button class="btn" id="fly">🌬️ 強風で飛ばす！</button></div><div id="after" class="gone"><div class="result" id="result"></div><button class="btn" id="next">翌日へ進む ☀️</button></div><button class="btn secondary gone" id="again">次のヅラで遊ぶ ↻</button></section><section class="panel"><b>遊び方</b><p>① ヅラを選ぶ　② 強風で飛ばす　③ 翌日、戻ってくるか運試し！</p><p class="tiny">※結果はゲーム内の演出です。ページを開き直すと最初から遊べます。</p><button class="btn secondary" id="share">𝕏 でシェアする</button><p class="tiny">公開後は、このページのURLを添えて投稿できるよ。</p></section></main><script>
const wigs=[{name:'本体のヅラ',icon:'🪮',src:'wig_original.png'},{name:'アフロ',icon:'🌈'},{name:'バナナ',icon:'🍌'},{name:'ツインテール',icon:'🎀'},{name:'ヤンキー',icon:'⚡'},{name:'サングラス',icon:'🕶️'},{name:'金髪ボブ',icon:'👱'},{name:'ネコミミ',icon:'🐱'}];let selected=0,day=1,count=0,done=false;
const $=id=>document.getElementById(id);wigs.forEach((w,i)=>{let b=document.createElement('button');b.className='choice'+(i===0?' selected':'');b.innerHTML=`<span class="icon">${w.icon}</span>${w.name}`;b.onclick=()=>{if(done)return;selected=i;document.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',i===j));$('person').src=i===0?'character_wig.png':'character_bald.png';$('message').textContent=`「${w.name}」に決めた！ 強風に負けるな…！`};$('choices').appendChild(b)});
$('fly').onclick=()=>{if(done)return;done=true;$('choose').classList.add('gone');$('after').classList.remove('gone');$('hero').classList.add('fly');$('person').src='character_bald.png';$('message').textContent='ビューーーッ！！ ヅラが飛んでいった！';$('result').textContent='ヅラは風の向こうへ…';$('next').textContent='翌日へ進む ☀️'};
$('next').onclick=()=>{const back=Math.random()<.48;day++;$('day').textContent=day+'日目';$('hero').classList.remove('fly');$('person').src=back?'character_wig.png':'character_bald.png';if(back){count++;$('count').textContent=count;$('result').textContent='帰ってきたーー！！ 🎉';$('message').textContent='翌日の風がヅラを連れてきた！';$('person').classList.add('return');setTimeout(()=>$('person').classList.remove('return'),900)}else{$('result').textContent='今日は戻ってこなかった…！';$('message').textContent='どこかで風に乗っているのかも…'}$('next').classList.add('gone');$('again').classList.remove('gone')};
$('again').onclick=()=>{done=false;$('choose').classList.remove('gone');$('after').classList.add('gone');$('again').classList.add('gone');$('next').classList.remove('gone');$('person').src='character_wig.png';$('message').textContent='次はどのヅラにする？';document.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===0));selected=0};
$('share').onclick=()=>{const text='ヅラよ、帰ってこい！ 風で飛ばして、翌日に戻ってくるヅラを待つゲームだよ！';const url=location.href;window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(url),'_blank')};</script></body></html>
